name: Primordial shot fault log
on:
  push:
    branches:
      - feature/primordial-shot-diagnostics
  pull_request:
    branches:
      - main
    paths:
      - specter_primordial.lua
      - tools/apply_primordial_diagnostics.py
      - tests/primordial_diagnostics_regress.py
      - .github/workflows/primordial-shot-diagnostics.yml
permissions:
  contents: write
concurrency:
  group: primordial-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LuaJIT test runtime
        run: python -m pip install lupa==2.6
      - name: Apply the fault logger fragments
        id: apply
        continue-on-error: true
        run: |
          mkdir -p ci-report
          python tools/apply_primordial_diagnostics.py --apply 2>&1 | tee ci-report/apply.txt
          test "${PIPESTATUS[0]}" -eq 0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --exit-code -- specter_primordial.lua
          fi
      - name: Fault logger tests
        id: diag
        continue-on-error: true
        run: |
          mkdir -p ci-report
          python tests/primordial_diagnostics_regress.py 2>&1 | tee ci-report/diag.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Earlier safety tests
        id: safety
        continue-on-error: true
        run: |
          mkdir -p ci-report
          python tests/primordial_safety_regress.py 2>&1 | tee ci-report/safety.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Primordial regressions
        id: regress
        continue-on-error: true
        run: |
          mkdir -p ci-report
          python tests/primordial_regress.py 2>&1 | tee ci-report/regress.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Advanced Lua harness
        id: adv
        continue-on-error: true
        run: |
          mkdir -p ci-report
          cat > /tmp/adv.py <<'PY'
          from lupa.luajit21 import LuaRuntime
          lua = LuaRuntime(unpack_returned_tuples=True)
          lua.execute('arg = {}; dofile("tests/primordial_advanced.lua")')
          PY
          python /tmp/adv.py 2>&1 | tee ci-report/adv.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Commit the result to the feature branch
        if: github.event_name == 'push' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.apply.outcome }}" = "success" ] && [ "${{ steps.diag.outcome }}" = "success" ] && [ "${{ steps.safety.outcome }}" = "success" ] && [ "${{ steps.regress.outcome }}" = "success" ] && [ "${{ steps.adv.outcome }}" = "success" ]; then
            git rm -rqf --ignore-unmatch ci-report
            git add -- specter_primordial.lua
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -m "Added per shot fault log" -m "- [PM] Every shot now names the most likely reason it missed"
            git push origin HEAD:feature/primordial-shot-diagnostics
          else
            git add -f ci-report
            git commit -m "Updated check report" -m "- [PM] Check output for the fault log branch"
            git push origin HEAD:feature/primordial-shot-diagnostics
          fi
      - name: Fail when a check failed
        if: always()
        run: |
          for r in "${{ steps.apply.outcome }}" "${{ steps.diag.outcome }}" "${{ steps.safety.outcome }}" "${{ steps.regress.outcome }}" "${{ steps.adv.outcome }}"; do
            if [ "$r" != "success" ]; then
              echo "A check failed."
              exit 1
            fi
          done

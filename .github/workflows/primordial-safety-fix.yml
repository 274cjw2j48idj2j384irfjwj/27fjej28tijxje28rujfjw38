name: Primordial safety patch and regressions
on:
  push:
    branches:
      - fix/primordial-resolver-aa-audit
  pull_request:
    branches:
      - main
    paths:
      - specter_primordial.lua
      - tools/primordial_safety_patch.py
      - tools/apply_primordial_reviewed_edits.py
      - tests/primordial_safety_regress.py
      - .github/workflows/primordial-safety-fix.yml
permissions:
  contents: write
concurrency:
  group: primordial-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LuaJIT regression runtime
        run: python -m pip install lupa==2.6
      - name: Apply only uniquely matched reviewed fragments
        run: |
          python tools/apply_primordial_reviewed_edits.py --apply
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --exit-code -- specter_primordial.lua
          fi
      - name: Run targeted LuaJIT safety regressions
        run: python tests/primordial_safety_regress.py
      - name: Run existing Primordial regressions
        run: python tests/primordial_regress.py
      - name: Run existing advanced Lua harness
        run: |
          python - <<'PY'
          from lupa.luajit21 import LuaRuntime
          lua = LuaRuntime(unpack_returned_tuples=True)
          lua.execute('arg = {}; dofile("tests/primordial_advanced.lua")')
          PY
      - name: Commit validated Lua to the review branch only
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- specter_primordial.lua; then
            echo "Reviewed patch already applied; no source commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- specter_primordial.lua
          git commit -m "Fixed aim feedback" -m "- [PM] Corrected resolver shot attribution and held decisions" -m "- [PM] Prevented repeated learning and stale anti-aim reactions"
          git push origin HEAD:fix/primordial-resolver-aa-audit
